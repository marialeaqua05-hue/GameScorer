<!DOCTYPE html>
<html>
<head>
    <title>Tarea 4</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!--MUESTRA EL NOMBRE DE LA APLICACIÓN-->
    <header>
        <h1>GameScorer</h1>
    </header>

    <!--CONTIENE TODOS LOS ELEMENTOS CON LOS QUE EL USUARIO PODRÁ OPERAR EL TMDC-->
    <section>
        <!--FORMULARIO DE CONFIGURACIÓN-->
        <div id="vista-configuracion">
            <form class="caja-configuracion">
            <!--TABLA DE CONFIGURACIONES DE LOS CRITERIOS PREDEFINIDOS Y SUS PONDERACIONES-->
            <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Criterios</th>
                        <th>Ponderaciones</th>
                    </tr>
                </thead>
                <!--PARTE DE LA TABLA DONDE EL USUARIO ASIGNARÁ EL VALOR DE CADA PONDERACIÓN-->
                <tbody>
                    <tr>
                        <th>Costos</th>
                        <td><input type="number" id="config-costo" class="input-ponderacion" step="0.01" min="0" max="1" placeholder="0.25"></td>
                    </tr>
                    <tr>
                        <th>Plataforma</th>
                        <td><input type="number" id="config-plataforma" class="input-ponderacion" step="0.01" min="0" max="1" placeholder="0.25"></td>
                    </tr>
                    <tr>
                        <th>Género</th>
                        <td><input type="number" id="config-genero" class="input-ponderacion" step="0.01" min="0" max="1" placeholder="0.25"></td>
                    </tr>
                    <tr>
                        <th>Arte</th>
                        <td><input type="number" id="config-arte" class="input-ponderacion" step="0.01" min="0" max="1" placeholder="0.25"></td>
                    </tr>
                    <tr>
                        <th>Música</th>
                        <td><input type="number" id="config-musica" class="input-ponderacion" step="0.01" min="0" max="1" placeholder="0.25"></td>
                    </tr>
                    <tr>
                        <th>Duración del juego</th>
                        <td><input type="number" id="config-duracion" class="input-ponderacion" step="0.01" min="0" max="1" placeholder="0.25"></td>
                    </tr>
                    <tr>
                        <th>Reseñas</th>
                        <td><input type="number" id="config-resena" class="input-ponderacion" step="0.01" min="0" max="1" placeholder="0.25"></td>
                    </tr>
                </tbody>
            </table>
            <!--TABLA QUE PERMITIRÁ AL USUARIO ASIGNAR VALORES ENTRE VARIAS PLATAFORMAS PARA VIDEOJUEGOS ENTRE 1 Y 10.-->
            <table>
                <thead>
                    <tr>
                        <th>Plataformas</th>
                        <th>Valor</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th>PC</th>
                        <th><input type="number" id="input-valor-pc" min="1" max="10" placeholder="Ejem.6"></th>
                    </tr>
                    <tr>
                        <th>Xbox</th>
                        <th><input type="number"  id="input-valor-xbox" min="1" max="10" placeholder="Ejem.6"></th>
                    </tr>
                    <tr>
                        <th>PlayStation 5</th>
                        <th><input type="number"  id="input-valor-playstation" min="1" max="10" placeholder="Ejem.6"></th>
                    </tr>
                    <tr>
                        <th>Switch</th>
                        <th><input type="number"  id="input-valor-switch" min="1" max="10" placeholder="Ejem.6"></th>
                    </tr>
                    <tr>
                        <th>Switch 2</th>
                        <th><input type="number"  id="input-valor-switch2" min="1" max="10" placeholder="Ejem.6"></th>
                    </tr>
                    <tr>
                        <th>Celular</th>
                        <th><input type="number" id="input-valor-celular" min="1" max="10" placeholder="Ejem.6"></th>
                    </tr>
                    <tr>
                        <th>Todo</th>
                        <th><input type="number" id="input-valor-todo" min="1" max="10" placeholder="Ejem.6"></th>
                    </tr>
                </tbody>
            </table>
            </div>
            <div class="table-container-genero">
            <!--TABLA QUE CONTENDRÁ LOS GÉNEROS AGREDADOS POR EL USUARIO Y SU VALOR DE 1 A 10 ASIGNADO POR EL.-->
            <table class="table-genero">
                <thead>
                    <tr>
                        <th>Género</th>
                        <th>Valor</th>
                    </tr>
                </thead>
                <tbody id="tabla-genero"></tbody>
            </table>
            <!--APARTADO QUE PERMITE AGREGAR GENEROS Y UN VALOR A LA TABLA DE GENEROS-->
            <div id="controles-genero">
                <input type="text" input="input-nombre-genero" placeholder="Ejem. FPS">
                <input type="number" id="input-valor-genero" min="1" max="10" placeholder="Ejem.6">
                <button type="button" id="btn-agregar-genero" class="button-agg">Agregar</button>
            </div>
            </div>

            <!--TEXTBOX PARA OBTENER EL NUMERO DE ALTERNATIVAS (SE LIMITARÁ A 10 ALTERNATIVAS)-->
            <div class="container-input">
                <label for="num_alter">Número de alternativas:</label>
                <input type="number" id="num_alter" name="alternativas" class="input-ponderacion" min="2" max="10" placeholder="2-10 alternativas">
            
                <button type="button" id="btn-generar" class="button-generar">Generar tabla</button>
                </div>
            </form>
        </div>

        <!--TABLA QUE CONTENDRA LAS ALTERNATIVAS Y LOS CRITERIOS(Y SUS PONDERACIONES)-->
        <!--TABLA MATRIZ-->
        <div id="vista-matriz" class="oculto">
            <table>
                <!--CABECERO DE LA TABLA MATRIZ-->
                <thead>
                    <tr>
                        <th>Juegos</th>
                        <th>Costo</th>
                        <th>Plataforma</th>
                        <th>Género</th>
                        <th>Arte</th>
                        <th>Música</th>
                        <th>Duración del juego</th>
                        <th>Reseñas</th>
                        <th>Suma de puntaje</th>
                    </tr>
                    <!--FILA QUE MOSTRARA LAS PONDERACIONES ASIGNADAS DESDE LA PRIMERA TABLA DE PONDERACIONES-->
                    <!--PERMITE MODIFICAR LOS PESOS DE LAS PONDERACIONES DESDE ESTA OTRA TABLA-->
                    <tr>
                        <th>Pesos asignados</th>
                        <th><input type="number" id="matriz-costo" class="input-ponderacion" step="0.01" min="0" max="1" ></th>
                        <th><input type="number" id="matriz-plataforma" class="input-ponderacion" step="0.01" min="0" max="1" ></th>
                        <th><input type="number" id="matriz-genero" class="input-ponderacion" step="0.01" min="0" max="1" ></th>
                        <th><input type="number" id="matriz-arte" class="input-ponderacion" step="0.01" min="0" max="1" ></th>
                        <th><input type="number" id="matriz-musica" class="input-ponderacion" step="0.01" min="0" max="1" ></th>
                        <th><input type="number" id="matriz-duracion" class="input-ponderacion" step="0.01" min="0" max="1" ></th>
                        <th><input type="number" id="matriz-resena" class="input-ponderacion" step="0.01" min="0" max="1" ></th>
                        <th></th>
                    </tr>
                </thead>
                <!--CUERPO DE LA TABLA MATRIZ-->
                <tbody id="cuerpo-matriz"></tbody>

            </table>
        </div>

    </section>

    <footer></footer>
    <!--CÓDIGO QUE PERMITE HACER LA UNIÓN CON EL SCRIPT DE JAVASCRIPT-->
    <script src="js/logica.js"></script>
</body>
</html>
